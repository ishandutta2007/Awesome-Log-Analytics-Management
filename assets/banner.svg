<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .pulse-line {
        stroke-dasharray: 2000;
        stroke-dashoffset: 2000;
        animation: dash 8s linear infinite;
      }
      .pulse-node {
        animation: pulse 2s ease-in-out infinite alternate;
      }
      .bar-anim {
        animation: grow 3s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes pulse {
        0% { r: 4px; opacity: 0.6; }
        100% { r: 8px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes grow {
        0% { transform: scaleY(0.7); }
        100% { transform: scaleY(1.1); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Dynamic Background Lines (Log Stream Lines) -->
  <g opacity="0.25">
    <path d="M-50 280 Q 200 150 450 260 T 950 180 T 1250 240" fill="none" stroke="#6366f1" stroke-width="2" class="pulse-line" />
    <path d="M-50 120 Q 300 280 600 140 T 1100 220 T 1250 100" fill="none" stroke="#a855f7" stroke-width="2" class="pulse-line" />
    <path d="M-50 200 Q 150 320 500 180 T 900 290 T 1250 160" fill="none" stroke="#ec4899" stroke-width="1.5" class="pulse-line" />
  </g>

  <!-- Background Dynamic Log Histogram Elements (Right Side Graphic) -->
  <g opacity="0.2" transform="translate(850, 100)">
    <rect x="0" y="40" width="18" height="120" rx="4" fill="#38bdf8" class="bar-anim" style="animation-delay: 0s;" />
    <rect x="28" y="10" width="18" height="150" rx="4" fill="#6366f1" class="bar-anim" style="animation-delay: 0.4s;" />
    <rect x="56" y="70" width="18" height="90" rx="4" fill="#a855f7" class="bar-anim" style="animation-delay: 0.8s;" />
    <rect x="84" y="20" width="18" height="140" rx="4" fill="#ec4899" class="bar-anim" style="animation-delay: 0.2s;" />
    <rect x="112" y="90" width="18" height="70" rx="4" fill="#38bdf8" class="bar-anim" style="animation-delay: 0.6s;" />
    <rect x="140" y="30" width="18" height="130" rx="4" fill="#6366f1" class="bar-anim" style="animation-delay: 1s;" />
    <rect x="168" y="60" width="18" height="100" rx="4" fill="#a855f7" class="bar-anim" style="animation-delay: 0.5s;" />
    <rect x="196" y="5" width="18" height="155" rx="4" fill="#ec4899" class="bar-anim" style="animation-delay: 0.1s;" />
  </g>

  <!-- Node Dots (Data Points) -->
  <g fill="#38bdf8">
    <circle cx="200" cy="210" r="5" class="pulse-node" style="animation-delay: 0s;" />
    <circle cx="450" cy="260" r="6" class="pulse-node" style="animation-delay: 0.5s;" />
    <circle cx="700" cy="180" r="5" class="pulse-node" style="animation-delay: 1s;" />
    <circle cx="950" cy="180" r="7" class="pulse-node" style="animation-delay: 1.5s;" />
  </g>

  <!-- Foreground Main Title & Subtitle Card (Ensures readability in foreground) -->
  <g transform="translate(60, 65)">
    <!-- Decorative Tag -->
    <rect x="0" y="0" width="210" height="28" rx="14" fill="url(#accentGrad)" opacity="0.9" />
    <text x="105" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" filter="url(#shadow)">
      Awesome Log Analytics
    </text>
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#accentGrad)" filter="url(#shadow)">
      &amp; Management 📊
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Top SaaS Platforms &amp; Open-Source Log Pipelines for Observability, SIEM, &amp; Analytics
    </text>

    <!-- Pill Tags -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="17" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="600" text-anchor="middle">☁️ SaaS Platforms</text>

      <rect x="140" y="0" width="150" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="215" y="17" font-family="sans-serif" font-size="11" fill="#a855f7" font-weight="600" text-anchor="middle">⚡ Open-Source (OSS)</text>

      <rect x="300" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="365" y="17" font-family="sans-serif" font-size="11" fill="#ec4899" font-weight="600" text-anchor="middle">📈 Market Insights</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="344" width="1200" height="6" fill="url(#accentGrad)" />
</svg>
